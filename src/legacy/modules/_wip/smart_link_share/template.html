<div class="mDialog ds-none wo-editor-access" id="SmartLinkShareDialog">
    <div class="dialog-container lg-7 d-center">
        <div class="dialog-content">
            <div class="dia_header_div">
                <div class="dia_header_text">Smart Link Share</div>
            </div>
            <div class="d-flex flex-column dialog-body" data-id="dialog-body">
                <div class="row">
                    <div class="col-md-4">
                        <h6>Active Users</h6>
                        <div id="smart_link_active_users" class="small border rounded p-2" style="min-height:120px;"></div>
                    </div>
                    <div class="col-md-8">
                        <h6>Requests</h6>
                        <div id="smart_link_request_log" class="small border rounded p-2" style="min-height:160px;max-height:260px;overflow:auto;"></div>
                    </div>
                </div>
            </div>
            <div class="default dialog-footer" data-id="dialog-footer">
                <button type="button" title="check active users" id="smart_link_check_active" class="btn btn-sm secondary-btn">Check Active</button>
                <button type="button" title="close" id="smart_link_close" class="btn btn-sm primary-btn">Close</button>
            </div>
        </div>
    </div>
</div>
