<div class="mDialog ds-none wo-editor-access" id="CollaborativeModuleDialog">
    <div class="dialog-container lg">
        <div class="dialog-content">
            <div class="dia_header_div ui-draggable-handle">
                <div class="dia_header_text">Collaborative Status</div>
                <div class="ml-auto closeIcons" title="Close" data-collab-close>
                    <img class="n_Img" src="assets/images/svg/dialogClose.svg" alt="Close">
                </div>
            </div>
            <div class="d-flex flex-column dialog-body" data-id="dialog-body" style="max-height:70vh;overflow:auto;">
                <div class="collab-status-summary mb-2" data-collab-status-summary></div>
                <div class="collab-mode-controls border rounded p-2 mb-2 ds-none" data-collab-mode>
                    <h6 class="mb-2">Testing Mode</h6>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Collaboration testing mode">
                        <button type="button" class="btn secondary-btn btn-sm" data-collab-mode-value="legacy">Legacy paraLockSync</button>
                        <button type="button" class="btn secondary-btn btn-sm" data-collab-mode-value="collaborative">Collaborative Module</button>
                        <button type="button" class="btn secondary-btn btn-sm" data-collab-mode-value="off">Off</button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-5">
                        <h6 class="mb-2">Active Users</h6>
                        <div class="collab-user-list" data-collab-users></div>
                    </div>
                    <div class="col-md-7">
                        <h6 class="mb-2">Recent Activity</h6>
                        <div class="collab-activity-list" data-collab-activity></div>
                    </div>
                </div>
                <div class="collab-db-debug mt-3 ds-none" data-collab-debug>
                    <h6 class="mb-2">DB Data</h6>
                    <pre class="mb-0" data-collab-db style="white-space:pre-wrap;max-height:220px;overflow:auto;"></pre>
                </div>
            </div>
            <div class="default dialog-footer" data-id="dialog-footer">
                <button type="button" class="btn secondary-btn btn-sm" data-collab-refresh>Refresh</button>
                <button type="button" class="btn primary-btn btn-sm ml-auto" data-collab-close>Close</button>
            </div>
        </div>
    </div>
</div>
