<div class="mDialog ds-none w-editor-access" id="DocumentRestoreDialog">
    <div class="dialog-container md-5">
        <div class="dialog-content">
            <!-- header -->
            <div class="dia_header_div">
                <div class="dia_header_text">Document Saved History</div>
                <div class="ml-auto closeIcons" title="Close"><img alt="Close" class="n_Img" src="assets/images/svg/dialogClose.svg"></div>
            </div>
            <!--? body -->
            <div class="d-flex flex-column dialog-body" data-id="dialog-body">
                <form class="" id="RestoreBody" onsubmit="return false;" spellcheck="false">
                    <div class="form-group mb-0">
                        <div class="row">
                            <div class="col"><span class="labelText">Select Version</span>
                                <div class='version_list'></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <!-- ? body end -->
            <!-- ? Footer section start -->
            <div class="default dialog-footer" data-id="dialog-footer">
                <button type="submit" title="cancel" id="cancel_Restore" class="btn btn-sm secondary-btn cancel_btn">Cancel</button>
                <button type="submit" title="restore" id="restore_version" class="btn btn-sm primary-btn disabled">Restore this version</button>
            </div>
            <div class="d-flex justify-content-center align-items-center" id="">
                <div class="restore-foot" id=""><b>Note:</b>&#x2002;Your current document will revert to the earlier selected version</div>
            </div>
        </div>
    </div>
</div>
