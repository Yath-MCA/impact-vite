<div class="mDialog ds-none wo-editor-access" id="AIAssistanceDialog">
    <div class="dialog-container lg-7 d-center">
        <div class="dialog-content">
            <div class="dia_header_div">
                <div class="dia_header_text">AI Assistance</div>
            </div>
            <div class="d-flex flex-column dialog-body" data-id="dialog-body">
                <div id="ai_assistance_thread" class="border rounded p-2 mb-2" style="min-height:240px;max-height:340px;overflow:auto;"></div>
                <textarea id="ai_assistance_prompt" class="form-control form-control-sm" rows="3" placeholder="Ask AI assistance"></textarea>
            </div>
            <div class="default dialog-footer" data-id="dialog-footer">
                <button type="button" title="ask ai" id="ai_assistance_ask" class="btn btn-sm secondary-btn">Ask</button>
                <button type="button" title="continue to support" id="ai_assistance_escalate" class="btn btn-sm secondary-btn">Continue to Support</button>
                <button type="button" title="close" id="ai_assistance_close" class="btn btn-sm primary-btn">Close</button>
            </div>
        </div>
    </div>
</div>
