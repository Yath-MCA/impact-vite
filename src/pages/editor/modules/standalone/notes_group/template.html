<div class="mDialog ds-none wo-editor-access" id="NotesGroupDialog">
    <div class="dialog-container">
        <div class="dialog-content">
            <div class="dia_header_div">
                <div class="dia_header_text">Insert Notes</div>
                <div class="ml-auto closeIcons" title="Close"><img alt="Close" class="n_Img" src="assets/images/svg/dialogClose.svg"></div>
            </div>
            <div class="d-flex dialog-body" data-id="dialog-body">
                <div class="d-flex flex-column" id="display-notes">
                    <div class="d-flex note-option-head">
                        <span class="insert-note active" id="footnotes">Footnote</span>
                        <span class="insert-note" id="endnotes">Endnote</span>
                    </div>
                    <div class="sn-h-3xl">
                        <div id="notes-body" contenteditable="false"></div>
                    </div>
                    <form id="notes-options">
                        <div class="form-group mb-0 ds-none">
                            <input class="form-check-input" type="checkbox" value="" id="numberCheck" checked>
                            <label class="form-check-label" for="numberCheck" title="Numbering">Numbered</label>
                        </div>
                    </form>
                    <div class="ALERT_DIV_RM ds-none" id="ALERT_DIV_NOTS">Please place the cursor in the text where the note citation should appear.</div>
                </div>
            </div>
            <div class="d-flex dialog-footer" data-id="dialog-footer">
                <button type="submit" title="cancel" id="" class="btn secondary-btn btn-sm ml-auto cancel_btn ml-auto">Cancel</button>
                <button type="submit" title="Insert" id="" class="btn primary-btn btn-sm submit_btn">Insert</button>
            </div>
        </div>
    </div>
</div>
