<div class="mDialog ds-none w-editor-access wip-reference-dialog" id="ReferenceDialog">
    <div class="dialog-container xl">
        <div class="dialog-content">
            <div class="dia_header_div">
                <div class="dia_header_text" data-id="headerTitle">Insert New Reference</div>
                <div class="ml-auto closeIcons" title="Close"><img class="n_Img" src="assets/images/svg/dialogClose.svg" alt="Close Icon"></div>
            </div>
            <div class="dialog-body" data-id="dialog-body">
                <div class="spinner-border iSpin_border hide" role="status" id="reference_spinner">
                    <span class="sr-only">Loading...</span>
                </div>
                <form class="mb-2" onsubmit="return false;" spellcheck="false">
                    <div class="form-group row" id="reference_type_options_form">
                        <label class="col-sm col-form-label">Reference Type</label>
                        <div class="col mt-0 invisible"></div>
                        <div class="col mt-0 align-self-end">
                            <div class="btn-group btn-group-toggle" role="group" id="reference_type_btngroup" data-toggle="buttons">
                                <label class="btn btn-sm primary-btn active" value="journal"><input type="radio" name="REFERENCE_REF_TYPE" value="journal"> Journals</label>
                                <label class="btn btn-sm primary-btn" value="book"><input type="radio" name="REFERENCE_REF_TYPE" value="book"> Book</label>
                                <label class="btn btn-sm primary-btn" value="ed-book"><input type="radio" name="REFERENCE_REF_TYPE" value="ed-book"> Book Chapter</label>
                                <label class="btn btn-sm primary-btn ds-none" value="other"><input type="radio" name="REFERENCE_REF_TYPE" value="other"> Conf/Web/Other</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group" id="reference_ins_ref_method_group">
                        <div class="btn-group btn-group-toggle w-100" data-toggle="buttons">
                            <label class="btn primary-btn btn-light active">
                                <input type="radio" name="REFERENCE_INS_METHOD" id="reference_doi_id" value="doi_form" checked> DOI
                            </label>
                            <label class="btn primary-btn btn-light">
                                <input type="radio" name="REFERENCE_INS_METHOD" id="reference_form_id" value="open_form"> Form Based
                            </label>
                            <label class="btn primary-btn btn-light">
                                <input type="radio" name="REFERENCE_INS_METHOD" id="reference_plain_text_id" value="plain_text"> Plain Text
                            </label>
                        </div>
                    </div>
                    <div id="reference_form_group" class="" data-group-show="doi_form">
                        <div class="form-group" id="reference_div_plain_text">
                            <label class="mt-3" for="reference_plain_value">Text Area</label>
                            <textarea aria-label="Reference text" placeholder="Enter or Paste reference text here" class="form-control form-control-sm mt-2" id="reference_plain_value" rows="3"></textarea>
                            <div class="form-check mt-2 ds-none" id="reference_bulk_plain_wrap">
                                <input class="form-check-input" type="checkbox" id="reference_bulk_plain_insert">
                                <label class="form-check-label" for="reference_bulk_plain_insert" data-lang-lab="bulk_plain_insert">Bulk insert (one entry per paragraph)</label>
                            </div>
                            <div class="" id="reference_cite_input_group">
                                <label class="mt-3" for="reference_plain_text_cite">Citation Text</label>
                                <input type="text" autocomplete="off" class="form-control form-control-sm" id="reference_plain_text_cite" placeholder="">
                            </div>
                        </div>
                        <div id="reference_div_doi_form">
                            <div class="form-group mb-2">
                                <div class="row">
                                    <div class="col-9"><input type="text" autocomplete="off" class="form-control form-control-sm opacity" id="reference_doi_value" aria-label="Enter Id here" placeholder="Enter Id here"></div>
                                    <div class="col"><button type="button" class="btn primary-btn btn-sm btn-block disabled" id="reference_validate_doi_btn" title="Fetch from Database">Fetch</button></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group opacity" id="reference_div_open_form" data-current-form="journal">
                            <div class="" id="reference_person_group">
                                <div class="row">
                                    <div class="col-4"><span data-lang-lab="surname" class="labelText">Surname</span></div>
                                    <div class="col-4"><span data-lang-lab="given_name" class="labelText">Given Name</span></div>
                                    <div class="col-4"></div>
                                </div>
                                <div id="reference_author_section" class="">
                                    <div class="author-label">Authors</div>
                                    <div class="person-group" id="reference_author_repeat"></div>
                                </div>
                                <div id="reference_editor_section" class="ds-none" data-query-matched="true">
                                    <div class="editor-label">Editors</div>
                                    <div class="person-group" id="reference_editor_repeat"></div>
                                </div>
                                <div class="form-group">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="reference_etal"><label class="form-check-label" for="reference_etal" data-lang-lab="etal">et al.</label></div>
                                </div>
                                <div class="form-group">
                                    <label data-lang-lab="collab" for="reference_collab">Collab</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_collab" placeholder="Collab content here">
                                </div>
                            </div>
                            <div class="form-group" data-id="title_group">
                                <label for="reference_title" data-lang-lab="title">Title</label>
                                <div class="mt-0" data-input="journal"><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_title" placeholder="Article Title"></div>
                                <div class="" data-input="ed-book"><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_chapter_title" placeholder="Chapter Title"></div>
                            </div>
                            <div class="form-group">
                                <label for="reference_source" data-lang-lab="source">Source</label>
                                <input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_source" placeholder="Source here">
                            </div>
                            <div class="row" id="reference_entry_row_2">
                                <div class="col-2 form-group"><label data-lang-lab="year" for="reference_year">Year</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" placeholder="year" id="reference_year"></div>
                                <div class="col-6 form-group">
                                    <div class="row" id="reference_issue_vol_group">
                                        <div class="col-6 form-group"><label data-lang-lab="vol" for="reference_volume">Volume</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_volume" placeholder="volume"></div>
                                        <div class="col-6 form-group" data-input="journal"><label data-lang-lab="issue" for="reference_issue">Issue</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_issue" placeholder="issue"></div>
                                        <div class="col form-group" data-input="book ed-book"><label data-lang-lab="edn" for="reference_edition">Edition</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" placeholder="edition" id="reference_edition"></div>
                                    </div>
                                </div>
                                <div class="col" id="reference_page_group">
                                    <div class="row" id="reference_page_group_div">
                                        <div class="col-6 form-group"><label data-lang-lab="f_page" for="reference_fpage">Page Start</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_fpage" placeholder="first page"></div>
                                        <div class="col-6 form-group"><label data-lang-lab="l_page" for="reference_lpage">Page End</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_lpage" placeholder="last page"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="row" data-input="book ed-book" id="">
                                <div class="col form-group"><label data-lang-lab="pub_name" for="reference_publisher_name">Publisher name</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_publisher_name" placeholder="publisher-name"></div>
                            </div>
                            <div class="row" data-input="book ed-book" id="">
                                <div class="col form-group"><label data-lang-lab="pub_loc" for="reference_publisher_loc">Publisher location</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_publisher_loc" placeholder="publisher location"></div>
                            </div>
                            <div class="row">
                                <div class="col-4" data-input="journal"><label data-lang-lab="supp" for="reference_suppl">Supplement</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_suppl" placeholder="Supplemental"></div>
                                <div class="col"><label data-lang-lab="doi" for="reference_doi">DOI</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_doi" placeholder="DOI"></div>
                            </div>
                            <div class="row">
                                <div class="col"><label data-lang-lab="ext_link" for="reference_ext_link">URL</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_ext_link" placeholder="URL"></div>
                            </div>
                            <div class="row ds-none" data-client="plos">
                                <div class="col"><label data-lang-lab="pmid" for="reference_pmid">PMID</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm ds-none" id="reference_pmid" placeholder="PMID"></div>
                            </div>
                            <div class="form-group ds-none">
                                <div class="col-12"><label data-lang-lab="cmds" for="reference_comments">Comments</label></div>
                                <div class="col-12"><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm refborder refcomments" id="reference_comments" placeholder="Comments content here"></div>
                            </div>
                            <div class="row ds-none" id="reference_query_div">
                                <div class="col-12"><span class="labelText" data-lang-lab="query">Query</span></div>
                                <div class="col-12">
                                    <div autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_preview_query" placeholder="Query content will display"></div>
                                </div>
                            </div>
                            <div class="form-group ds-none" id="reference_query_close_div">
                                <label data-lang-lab="res_to_query" for="reference_query_respond" data-id="lab_cmd_qry">Respond to the query</label><input type="text" aria-label="Text area" autocomplete="off" class="inputDiv form-control form-control-sm" id="reference_query_respond" placeholder="" aria-label="Response text">
                            </div>
                            <div class="row ds-none" id="reference_hints_div">
                                <div class="col-12"><span class="labelText" data-lang-lab="hints-tips">Hints / Tips</span></div>
                                <div class="col-12">
                                    <div type="text" autocomplete="off" class="inputDiv form-control form-control-sm hints" id="reference_hint">Please place the cursor in the text where the reference citation should appear</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="default dialog-footer" data-id="dialog-footer">
                <button type="submit" title="Enable All Fields" id="reference_edit_all_field" class="btn secondary-btn btn-sm ds-none">Edit All Fields</button>
                <button type="submit" title="Respond to the query" id="reference_reply_qry_edit_ref" class="btn secondary-btn btn-sm ds-none" data-lang-lab="res_to_query">Respond to the query</button>
                <button type="submit" title="Click to Update" id="reference_update_cmd_edit_ref" class="btn secondary-btn btn-sm ds-none" data-lang-lab="update_with_cmd">Update with Command</button>
                <button type="submit" title="Click to Cancel" id="reference_cancel_edit_ref" class="btn secondary-btn btn-sm cancel_btn" data-lang-lab="cancel">Cancel</button>
                <button type="submit" title="Click to Update" id="reference_insert_edit_ref" class="btn primary-btn btn-sm disabled ds-none" data-lang-lab="update">Update</button>
                <button type="submit" title="Click to Insert" id="reference_insert_ref" class="btn primary-btn btn-sm">Insert</button>
                <button type="submit" title="Click to Insert" id="reference_insert_ref_wo_cite" class="btn secondary-btn btn-sm ds-none ml-2">Insert Reference Only</button>
            </div>
            <div class="" id="reference_preview_div"><span class="col labelText" data-lang-lab="preview">Preview</span>
                <div class="col preview" autocomplete="off" id="reference_preview"></div>
            </div>
        </div>
    </div>
</div>
