    <!-- QC Track: wait for e6_common (IS_TRACK_VIEW, dialogModule, USER_INFO) before mount -->
    <script type="module">
        import {
            bootstrapQcValidationTrack
        } from './assets/${{VERSION}}$/modules/qc_validation/QcValidationTrackModule.js?_${{TIMESTAMP}}$';

        const intervalId = setInterval(async () => {
            try {
                if (typeof IS_TRACK_VIEW === 'undefined') return;
                if (!IS_TRACK_VIEW) {
                    clearInterval(intervalId);
                    return;
                }
                if (typeof dialogModule === 'undefined' || typeof USER_INFO === 'undefined') return;
                clearInterval(intervalId);
                await bootstrapQcValidationTrack();
            } catch (err) {
                console.warn(err);
                clearInterval(intervalId);
            }
        }, 750);
    </script>
    <!-- Tooltip Track: xref/link/orcid hover without module_main -->
    <script type="module">
        import {
            bootstrapTooltipTrack
        } from './assets/${{VERSION}}$/modules/tooltip/TooltipTrackBootstrap.js?_${{TIMESTAMP}}$';

        const tipIntervalId = setInterval(() => {
            try {
                if (typeof IS_TRACK_VIEW === 'undefined') return;
                if (!IS_TRACK_VIEW) {
                    clearInterval(tipIntervalId);
                    return;
                }
                if (typeof GlobalEditor === 'undefined' || !GlobalEditor) return;
                const editable = GlobalEditor.editable && GlobalEditor.editable();
                if (!editable) return;
                if (typeof commonMethods === 'undefined') return;
                clearInterval(tipIntervalId);
                bootstrapTooltipTrack(GlobalEditor);
            } catch (err) {
                console.warn(err);
                clearInterval(tipIntervalId);
            }
        }, 750);
    </script>
